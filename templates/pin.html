{% extends "base.html" %}
{% block title %} Enter PIN {% endblock%}

{%block content %}

<div class="pin-box">
    <h3>Enter Business PIN</h3>

    <form method="POST">
        <input type='password' name='pin' placeholder='****' required>
        <input type='hidden' name='next' value="{{next_url}}">
        <input type='hidden' name='action_key' value="{{action_key}}">
        <button type='submit'>Unlock</button>
    </form>
</div>

{%endblock%}
